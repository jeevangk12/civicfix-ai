[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civicfix-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "cloudinary>=1.44,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.165,<1",
    "pillow>=12.3,<14",
    "PyJWT>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.27,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "httpx2>=2,<3",
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
